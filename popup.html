<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Site Timer</title>
<style>
  :root {
    --bg: #f5f5f7; --group: #fff; --text: #1d1d1f; --secondary: #6e6e73; --sep: rgba(0, 0, 0, .09);
    --field: rgba(0, 0, 0, .05); --accent: #007aff; --red: #ff3b30; --green: #34c759;
    --btn: #fff; --btn-border: rgba(0, 0, 0, .14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e; --group: #2a2a2c; --text: #f5f5f7; --secondary: #98989d; --sep: rgba(255, 255, 255, .08);
      --field: rgba(255, 255, 255, .07); --accent: #0a84ff; --red: #ff453a; --green: #30d158;
      --btn: #3a3a3c; --btn-border: rgba(255, 255, 255, .08);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 320px; padding: 16px; background: var(--bg); color: var(--text);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
  header img { width: 38px; height: 38px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header p { margin: 1px 0 0; color: var(--secondary); font-size: 12px; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 6px 2px; }
  .group { background: var(--group); border: .5px solid var(--sep); border-radius: 10px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 10px 0 12px; }
  .row + .row, #rows:not(:empty) + .row { border-top: .5px solid var(--sep); }
  .site { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .all { color: var(--secondary); }
  input {
    font: inherit; color: inherit; background: var(--field); border: 0; border-radius: 6px;
    padding: 4px 8px; outline: none; min-width: 0;
  }
  input::placeholder { color: var(--secondary); opacity: .7; }
  input:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }
  input.bad { box-shadow: 0 0 0 2px var(--red); }
  .new input:first-child { flex: 1; }
  .time { width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  .icon { border: 0; background: none; padding: 0; width: 18px; height: 18px; flex: none; cursor: pointer; display: grid; }
  .icon svg { width: 18px; height: 18px; }
  .icon:disabled { opacity: .35; cursor: default; }
  .remove { color: var(--red); }
  .plus { color: var(--green); }
  .push {
    font: inherit; color: var(--text); background: var(--btn); border: .5px solid var(--btn-border);
    border-radius: 6px; padding: 3px 12px; box-shadow: 0 .5px 1.5px rgba(0, 0, 0, .12); cursor: pointer;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .push:active { filter: brightness(.93); }
  .push:disabled { opacity: .5; cursor: default; filter: none; }
  .actions { margin: 8px 0 18px; }
  .label { flex: 1; }
  footer { margin-top: 12px; color: var(--secondary); font-size: 11.5px; }
  code { font: 11px ui-monospace, Menlo, monospace; }
</style>

<header>
  <img src="icons/128.png" alt="">
  <div>
    <h1>Site Timer</h1>
    <p>Closes a site's tab when its time runs out.</p>
  </div>
</header>

<h2>Time limits</h2>
<div class="group">
  <div id="rows"></div>
  <form class="row new" id="new">
    <input id="new-site" placeholder="Add a site…" aria-label="Site" spellcheck="false" autocomplete="off">
    <input id="new-time" class="time" aria-label="Time limit" autocomplete="off">
    <button class="icon plus" aria-label="Add site">
      <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="currentColor"/><path d="M10 5.5v9M5.5 10h9" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </form>
</div>
<div class="actions"><button class="push" id="current" disabled>Add Current Site</button></div>

<h2>Defaults</h2>
<div class="group">
  <label class="row"><span class="label">Time for new sites</span><input id="default" class="time" autocomplete="off"></label>
</div>

<footer>
  Enter minutes (<code>15</code>) or minutes:seconds (<code>2:30</code>). Add <code>*</code> to cover every other site.
  Changes apply to tabs you open next.
</footer>

<template id="row">
  <div class="row">
    <span class="site"></span>
    <input class="time" aria-label="Time limit" autocomplete="off">
    <button class="icon remove" aria-label="Remove">
      <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="currentColor"/><path d="M5.5 10h9" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
</template>

<script src="defaults.js"></script>
<script src="popup.js"></script>
</html>
